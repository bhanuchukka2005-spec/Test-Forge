name: TestForge CI
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Java unit tests and JaCoCo
        run: mvn --batch-mode clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r testing/python/requirements.txt
      - name: Run deterministic result-rule tests
        run: python -m pytest testing/python/test_result_logic.py -q
